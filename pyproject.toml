[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dreamteam"
version = "0.1.0"
description = "Utilitats de l'equip DreamTeam per a la Datathon FME"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E402"]  # els scripts configuren matplotlib abans d'importar pyplot

[tool.ruff.lint.isort]
known-first-party = ["dreamteam", "baseline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
