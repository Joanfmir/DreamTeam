name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Lint i tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt && pip install -e .
      - run: ruff check src tests reptes app
      - run: pytest -q

  smoke:
    name: Baselines amb dades reals
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt && pip install -e .
      - run: bash scripts/download_past_data.sh schneider accenture qualcomm
      - run: python reptes/2025_schneider_explicabilitat/baseline.py
      - run: python reptes/2022_accenture_supply_chain/baseline.py
      - run: |
          python reptes/2025_mango_demanda/simulate_data.py
          python reptes/2025_mango_demanda/pipeline.py
      - run: python reptes/2022_qualcomm_power_switches/solver.py data/past/2022_qualcomm/example_input.def
